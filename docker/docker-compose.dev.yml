services:
  app:
    build:
      context: ./..
      dockerfile: docker/Dockerfile_dev
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: ":8080"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    init: true
    restart: unless-stopped

volumes:
  node_modules:
  gomod:
  gobuild: