<ul class="space-y-1 text-sm pl-2">
    <li>
        <button class="hover:text-blue-400 text-left w-full"
                hx-get="/api/servers"
                hx-target="#servers-group"
                hx-swap="innerHTML"
                hx-on::before-request="if (toggleTreeChildren('servers-group')) event.preventDefault()">
            📁 Servers{{ if gt .ServerCount 0 }}
            <span class="text-xs text-gray-500">({{ .ServerCount }})</span>{{ end }}
        </button>
        <div id="servers-group" class="ml-4"></div>
    </li>
</ul>
