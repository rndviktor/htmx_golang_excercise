<ul class="space-y-1 text-sm pl-2">
    {{ range .Schemas }}
    <li>
        <button class="hover:text-blue-400 text-left w-full"
                hx-get="/api/servers/{{ $.ServerID }}/databases/{{ $.Database }}/schemas/{{ . }}/children"
                hx-target="#schema-{{ $.ServerID }}-{{ $.Database }}-{{ . }}"
                hx-swap="innerHTML"
                hx-on::before-request="if (toggleTreeChildren('schema-{{ $.ServerID }}-{{ $.Database }}-{{ . }}')) event.preventDefault()">
            🗂️ {{ . }}
        </button>
        <div id="schema-{{ $.ServerID }}-{{ $.Database }}-{{ . }}" class="ml-4"></div>
    </li>
    {{ else }}
    <li class="text-xs text-gray-500">No schemas found.</li>
    {{ end }}
</ul>
