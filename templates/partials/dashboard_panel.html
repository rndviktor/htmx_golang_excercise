<!-- Welcome Header Card -->
<div class="bg-gray-800 border border-gray-700 rounded-lg p-6 mb-6">
    <div class="flex items-center space-x-4">
        <div class="p-3 bg-blue-600/10 border border-blue-500/20 rounded-lg text-blue-400">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
            </svg>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-white">Postgres Admin Panel</h1>
            <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Management Tools for PostgreSQL</p>
        </div>
    </div>
</div>

<!-- Quick Links Panel -->
<div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4 border-b border-gray-700 pb-2">Quick Links</h2>
    <div class="flex items-center gap-6">
        <!-- Add New Server Action Button -->
        <button hx-get="/api/servers/new"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                class="flex flex-col items-center justify-center p-4 bg-gray-700/50 hover:bg-gray-700 border border-gray-600 rounded-lg group transition w-36">
            <div class="p-3 bg-blue-600/20 rounded-full mb-2 group-hover:bg-blue-600 transition text-blue-400 group-hover:text-white">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7v14"></path>
                </svg>
            </div>
            <span class="text-xs font-medium text-gray-300 group-hover:text-white text-center">Add New Server</span>
        </button>
    </div>
</div>
