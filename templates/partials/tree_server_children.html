<ul class="space-y-1 text-sm pl-2">
    <li>
        <button class="hover:text-blue-400 text-left w-full"
                hx-get="/api/servers/{{ .ServerID }}/databases"
                hx-target="#server-{{ .ServerID }}-databases"
                hx-swap="innerHTML"
                hx-on::before-request="if (toggleTreeChildren('server-{{ .ServerID }}-databases')) event.preventDefault()">
            📁 Databases
        </button>
        <div id="server-{{ .ServerID }}-databases" class="ml-4"></div>
    </li>
    <li>
        <button class="hover:text-blue-400 text-left w-full"
                hx-get="/api/servers/{{ .ServerID }}/roles"
                hx-target="#server-{{ .ServerID }}-roles"
                hx-swap="innerHTML"
                hx-on::before-request="if (toggleTreeChildren('server-{{ .ServerID }}-roles')) event.preventDefault()">
            📁 Login/Group Roles
        </button>
        <div id="server-{{ .ServerID }}-roles" class="ml-4"></div>
    </li>
    <li>
        <button class="hover:text-blue-400 text-left w-full"
                hx-get="/api/servers/{{ .ServerID }}/tablespaces"
                hx-target="#server-{{ .ServerID }}-tablespaces"
                hx-swap="innerHTML"
                hx-on::before-request="if (toggleTreeChildren('server-{{ .ServerID }}-tablespaces')) event.preventDefault()">
            📁 Tablespaces
        </button>
        <div id="server-{{ .ServerID }}-tablespaces" class="ml-4"></div>
    </li>
</ul>
