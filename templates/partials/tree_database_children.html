<ul class="space-y-1 text-sm pl-2">
    {{ range .Categories }}
    <li>
        <button class="hover:text-blue-400 text-left w-full"
                hx-get="/api/servers/{{ $.ServerID }}/databases/{{ $.Database }}/{{ .Slug }}"
                hx-target="#database-{{ $.ServerID }}-{{ $.Database }}-{{ .Slug }}"
                hx-swap="innerHTML"
                hx-on::before-request="if (toggleTreeChildren('database-{{ $.ServerID }}-{{ $.Database }}-{{ .Slug }}')) event.preventDefault()">
            📁 {{ .Label }}
        </button>
        <div id="database-{{ $.ServerID }}-{{ $.Database }}-{{ .Slug }}" class="ml-4"></div>
    </li>
    {{ end }}
</ul>
