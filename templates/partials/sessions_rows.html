{{ if .Sessions }}{{ range .Sessions }}<tr class="hover:bg-gray-700/50">
  <td class="p-1 border-r border-gray-700 text-center"><button onclick="cancelSession({{ .PID }})" class="text-gray-500 hover:text-blue-400" title="Cancel query"><svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button></td>
  <td class="p-1 border-r border-gray-700 text-center"><button onclick="terminateSession({{ .PID }})" class="text-gray-500 hover:text-red-400" title="Terminate backend"><svg class="w-3 h-3 inline" fill="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"></rect></svg></button></td>
  <td class="p-1 border-r border-gray-700 text-center text-gray-600"><svg class="w-3 h-3 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></td>
  <td class="p-1.5 border-r border-gray-700">{{ .PID }}</td>
  <td class="p-1.5 border-r border-gray-700 font-sans">{{ .Usename }}</td>
  <td class="p-1.5 border-r border-gray-700 font-sans">{{ .ApplicationName }}</td>
  <td class="p-1.5 border-r border-gray-700">{{ .ClientAddr }}</td>
  <td class="p-1.5 border-r border-gray-700">{{ .BackendStart }}</td>
  <td class="p-1.5 border-r border-gray-700">{{ .XactStart }}</td>
  <td class="p-1.5 border-r border-gray-700 font-sans {{ if eq .State "active" }}text-green-400{{ else if eq .State "idle in transaction" }}text-yellow-400{{ else }}text-gray-300{{ end }}">{{ .State }}</td>
  <td class="p-1.5 border-r border-gray-700 font-sans">{{ .WaitEvent }}</td>
  <td class="p-1.5">{{ .BlockingPIDs }}</td>
</tr>{{ end }}{{ else }}
<tr><td colspan="12" class="py-6 text-center text-gray-500 font-sans text-xs">No sessions found</td></tr>
{{ end }}
