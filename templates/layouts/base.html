<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }}{{ else }}Admin{{ end }}</title>
    <!-- Load htmx & CSS -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Collapses an expanded tree node. Returns true when the node was
        // open (caller should cancel the pending htmx request), false when
        // it should be fetched/expanded.
        function toggleTreeChildren(containerId) {
            const el = document.getElementById(containerId);
            if (el && el.childElementCount > 0) {
                el.innerHTML = "";
                return true;
            }
            return false;
        }

        // Makes the #sidebar panel resizable by dragging #sidebar-resizer.
        // Clamped between SIDEBAR_MIN and half the window; the chosen width
        // is remembered in localStorage. Double-click resets to the default.
        function initSidebarResize() {
            const sidebar = document.getElementById("sidebar");
            const resizer = document.getElementById("sidebar-resizer");
            if (!sidebar || !resizer) return;

            const MIN_WIDTH = 180;
            const DEFAULT_WIDTH = 256; // Tailwind w-64
            let startX = 0, startWidth = 0;

            function setWidth(px) {
                const max = Math.floor(window.innerWidth / 2);
                sidebar.style.width =
                    Math.min(max, Math.max(MIN_WIDTH, px)) + "px";
            }

            function onMove(e) {
                setWidth(startWidth + e.clientX - startX);
            }

            function onUp() {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                document.body.classList.remove("select-none");
                resizer.classList.remove("bg-blue-500");
                localStorage.setItem(
                    "sidebar-width",
                    String(parseInt(sidebar.style.width, 10)));
            }

            resizer.addEventListener("mousedown", (e) => {
                e.preventDefault();
                startX = e.clientX;
                startWidth = sidebar.getBoundingClientRect().width;
                document.body.classList.add("select-none");
                resizer.classList.add("bg-blue-500");
                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", onUp);
            });

            resizer.addEventListener("dblclick", () => {
                localStorage.removeItem("sidebar-width");
                setWidth(DEFAULT_WIDTH);
            });

            const saved = parseInt(localStorage.getItem("sidebar-width"), 10);
            if (!isNaN(saved)) setWidth(saved);
        }
        document.addEventListener("DOMContentLoaded", initSidebarResize);

        // -----------------------------------------------------------------------------
        // Right-click context menu for tree nodes carrying [data-tree-menu].
        // Purely visual for now: items are placeholders without server actions.
        // -----------------------------------------------------------------------------
        function initContextMenu() {
            const menu = document.getElementById("ctx-menu");
            if (!menu) return;

            let currentTableURL = null;

            function hideMenu() {
                menu.classList.add("hidden");
                currentTableURL = null;
            }

            function menuItem(label, danger) {
                const b = document.createElement("button");
                b.className = "block w-full text-left px-3 py-1.5 hover:bg-gray-700 " +
                    (danger ? "text-red-400 hover:text-red-300" : "");
                b.textContent = label;
                return b;
            }

            function openMenu(x, y, el) {
                menu.innerHTML = "";
                currentTableURL = null;

                const btn = el.querySelector("button[hx-get]");
                if (btn) currentTableURL = btn.getAttribute("hx-get");

                menu.appendChild(menuItem("Delete", true));

                const divider = document.createElement("div");
                divider.className = "my-1 border-t border-gray-700";
                menu.appendChild(divider);

                // "Scripts" row with a hover submenu.
                const row = document.createElement("div");
                row.className = "relative group";
                const trigger = document.createElement("button");
                trigger.className = "w-full text-left px-3 py-1.5 hover:bg-gray-700 flex items-center justify-between";
                trigger.innerHTML = '<span>Scripts</span><span class="text-xs text-gray-500">▸</span>';
                const sub = document.createElement("div");
                sub.className = "absolute left-full top-0 hidden group-hover:block bg-gray-800 border border-gray-600 rounded shadow-xl py-1 min-w-[12rem]";
                ["CREATE Script", "DELETE Script", "INSERT Script",
                 "SELECT Script", "UPDATE Script"].forEach(
                    (label) => {
                        const item = menuItem(label, false);
                        item.addEventListener("click", () => {
                            if (label === "SELECT Script" && currentTableURL) {
                                openSelectTab(currentTableURL);
                            } else {
                                openTab(label);
                            }
                        });
                        sub.appendChild(item);
                    });
                row.append(trigger, sub);
                menu.appendChild(row);

                menu.classList.remove("hidden");

                // Keep the menu inside the viewport.
                menu.style.left = "0px";
                menu.style.top = "0px";
                const rect = menu.getBoundingClientRect();
                menu.style.left = Math.max(0, Math.min(x, window.innerWidth - rect.width - 4)) + "px";
                menu.style.top = Math.max(0, Math.min(y, window.innerHeight - rect.height - 4)) + "px";
            }

            document.addEventListener("contextmenu", (e) => {
                const el = e.target.closest("[data-tree-menu]");
                if (!el) {
                    hideMenu();
                    return;
                }
                e.preventDefault();
                openMenu(e.clientX, e.clientY, el);
            });
            document.addEventListener("click", hideMenu);
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hideMenu();
            });
            window.addEventListener("blur", hideMenu);
        }
        document.addEventListener("DOMContentLoaded", initContextMenu);

        // -----------------------------------------------------------------------------
        // Tab management – open / switch / close tabs dynamically.
        // -----------------------------------------------------------------------------
        let tabCounter = 0;

        function switchTab(id) {
            document.querySelectorAll(".tab-btn").forEach((btn) => {
                const isActive = btn.dataset.tabId === id;
                btn.classList.toggle("bg-gray-900", isActive);
                btn.classList.toggle("text-blue-400", isActive);
                btn.classList.toggle("border-t-2", isActive);
                btn.classList.toggle("border-blue-500", isActive);
                btn.classList.toggle("text-gray-400", !isActive);
                btn.classList.toggle("hover:text-gray-200", !isActive);
            });
            document.querySelectorAll(".tab-panel").forEach((panel) => {
                panel.style.display = panel.id === "tab-content-" + id ? "" : "none";
            });
        }

        function executeQuery(btn, page) {
            const panel = btn.closest("[id^='tab-content']");
            if (!panel) return;
            const form = panel.querySelector("#query-editor");
            const grid = panel.querySelector("#data-grid");
            const status = panel.querySelector(".query-status");
            const pag = panel.querySelector(".pagination-controls");
            const pageInfo = panel.querySelector(".page-info");
            if (!form || !grid) return;

            const query = form.querySelector("textarea[name='sql_query']").value;
            const sid = form.querySelector("input[name='server_id']");
            const db = form.querySelector("input[name='db_name']");
            if (!sid || !db || !query) return;

            if (!page) page = 1;

            const body = new URLSearchParams({
                sql_query: query,
                server_id: sid.value,
                db_name: db.value,
                page: String(page),
                limit: "1000",
            });

            if (status) status.textContent = "Executing...";
            fetch("/api/execute-query", { method: "POST", body })
                .then((r) => {
                    if (!r.ok) throw r;
                    return r.text();
                })
                .then((html) => {
                    const tmp = document.createElement("div");
                    tmp.innerHTML = html;
                    const result = tmp.querySelector(".query-result");

                    if (grid && result) grid.innerHTML = result.innerHTML;

                    const total = parseInt(result.dataset.total) || 0;
                    const totalPages = parseInt(result.dataset.totalPages) || 1;
                    const curPage = parseInt(result.dataset.page) || 1;
                    const rows = grid ? grid.querySelectorAll("tbody tr").length : 0;

                    if (status) status.textContent = total + " row" + (total !== 1 ? "s" : "") + " (" + rows + " on page)";

                    if (totalPages > 1) {
                        pag.classList.remove("hidden");
                        pageInfo.textContent = "Page " + curPage + " of " + totalPages;
                        pag.dataset.page = curPage;
                        pag.dataset.totalPages = totalPages;
                    } else {
                        pag.classList.add("hidden");
                    }
                })
                .catch(async (r) => {
                    const msg = r.body ? await r.text() : "Request failed";
                    grid.innerHTML = '<div class="p-4 text-red-400 text-sm">' + msg + '</div>';
                    if (status) status.textContent = "Error";
                    if (pag) pag.classList.add("hidden");
                });
        }

        function goToPage(btn, action) {
            const panel = btn.closest("[id^='tab-content']");
            const pag = panel.querySelector(".pagination-controls");
            let page = parseInt(pag.dataset.page) || 1;
            const totalPages = parseInt(pag.dataset.totalPages) || 1;

            if (action === "prev") page = Math.max(1, page - 1);
            else if (action === "next") page = Math.min(totalPages, page + 1);
            else if (action === "last") page = totalPages;
            else if (typeof action === "number") page = action;

            const execBtn = panel.querySelector("button[onclick='executeQuery(this)']");
            if (execBtn) executeQuery(execBtn, page);
        }

        function openTab(label, query, serverID, dbName) {
            const id = "tab-" + (++tabCounter);

            // Create tab button
            const btn = document.createElement("button");
            btn.className = "tab-btn flex items-center space-x-2 px-4 py-2 font-medium rounded-t text-gray-400 hover:text-gray-200";
            btn.dataset.tabId = id;
            btn.innerHTML = '<span>' + label + '</span>' +
                '<span class="text-xs text-gray-500 hover:text-gray-300" onclick="closeTab(\'' + id + '\', event)">✕</span>';
            btn.addEventListener("click", (e) => {
                if (e.target.textContent === "✕") return;
                switchTab(id);
            });
            document.getElementById("tab-bar").appendChild(btn);

            // Create content panel and fetch its content from the server
            const panel = document.createElement("div");
            panel.id = "tab-content-" + id;
            panel.className = "tab-panel flex-1 flex flex-col overflow-hidden bg-gray-900 text-gray-200";
            panel.style.display = "none";
            document.getElementById("tab-contents").appendChild(panel);

            fetch("/api/tabs/script-panel")
                .then((r) => r.text())
                .then((html) => {
                    panel.innerHTML = html;

                    if (query) {
                        const editor = panel.querySelector("textarea[name='sql_query']");
                        if (editor) editor.value = query;
                    }
                    if (serverID && dbName) {
                        const form = panel.querySelector("#query-editor");
                        if (form) {
                            const sid = document.createElement("input");
                            sid.type = "hidden"; sid.name = "server_id"; sid.value = serverID;
                            form.appendChild(sid);
                            const db = document.createElement("input");
                            db.type = "hidden"; db.name = "db_name"; db.value = dbName;
                            form.appendChild(db);
                        }
                    }

                    // F5 keyboard shortcut
                    const textarea = panel.querySelector("textarea[name='sql_query']");
                    const execBtn = panel.querySelector("button[onclick='executeQuery(this)']");
                    if (textarea && execBtn) {
                        textarea.addEventListener("keydown", (e) => {
                            if (e.key === "F5") { e.preventDefault(); execBtn.click(); }
                        });
                    }
                });

            switchTab(id);
        }

        function openSelectTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            // URL: /api/servers/{id}/databases/{db}/schemas/{schema}/tables/{table}
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/columns")
                .then((r) => r.json())
                .then((data) => {
                    openTab("SELECT " + tableName, data.query, serverID, dbName);
                });
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const btn = document.querySelector('.tab-btn[data-tab-id="' + id + '"]');
            const panel = document.getElementById("tab-content-" + id);
            if (btn) btn.remove();
            if (panel) panel.remove();

            // Switch to the last remaining tab (Dashboard is always first)
            const remaining = document.querySelectorAll(".tab-btn");
            if (remaining.length > 0) {
                const last = remaining[remaining.length - 1];
                switchTab(last.dataset.tabId);
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen font-sans antialiased" hx-request='{"credentials": "same-origin"}'>

    <!-- Right-click context menu (filled in and shown by initContextMenu) -->
    <div id="ctx-menu"
         class="fixed z-50 hidden select-none bg-gray-800 border border-gray-600 rounded shadow-xl text-sm text-gray-200 py-1 min-w-[11rem]"></div>

    {{ if not .Authenticated }}
    <!-- ==========================================
         1. UNAUTHENTICATED LAYOUT (Login Shell)
         ========================================== -->
    <div class="flex items-center justify-center min-h-screen p-4" id="app-root">
        {{ template "login_content" . }}
    </div>

    {{ else }}
    <!-- ==========================================
         2. AUTHENTICATED LAYOUT (Main Application Shell)
         ========================================== -->
    <div class="flex flex-col h-screen overflow-hidden" id="app-root">
        
        <!-- Header / Server Switcher -->
        <header class="w-full bg-gray-800 border-b border-gray-700 flex justify-between items-center p-4">
            <span class="font-bold text-lg text-blue-400">Postgres Admin</span>
            <button hx-post="/logout" 
                    hx-target="#app-root" 
                    hx-select="#app-root"
                    hx-swap="outerHTML" 
                    class="text-xs bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white px-2 py-1 rounded transition">
                Logout
            </button>
        </header>

        <!-- Main Content Area (SQL Editor / Table Data View) -->
        {{ template "main_content" . }}

    </div>
    {{ end }}

</body>
</html>

{{ define "login_content" }}
  <!-- Default empty fallback if not defined by login.html -->
{{ end }}

{{ define "main_content" }}
  <!-- Default empty fallback if not defined by index.html -->
{{ end }}
