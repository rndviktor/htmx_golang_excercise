<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }}{{ else }}Admin{{ end }}</title>
    <!-- Load htmx & CSS -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Collapses an expanded tree node. Returns true when the node was
        // open (caller should cancel the pending htmx request), false when
        // it should be fetched/expanded.
        function toggleTreeChildren(containerId) {
            const el = document.getElementById(containerId);
            if (el && el.childElementCount > 0) {
                el.innerHTML = "";
                return true;
            }
            return false;
        }

        // Makes the #sidebar panel resizable by dragging #sidebar-resizer.
        // Clamped between SIDEBAR_MIN and half the window; the chosen width
        // is remembered in localStorage. Double-click resets to the default.
        function initSidebarResize() {
            const sidebar = document.getElementById("sidebar");
            const resizer = document.getElementById("sidebar-resizer");
            if (!sidebar || !resizer) return;

            const MIN_WIDTH = 180;
            const DEFAULT_WIDTH = 256; // Tailwind w-64
            let startX = 0, startWidth = 0;

            function setWidth(px) {
                const max = Math.floor(window.innerWidth / 2);
                sidebar.style.width =
                    Math.min(max, Math.max(MIN_WIDTH, px)) + "px";
            }

            function onMove(e) {
                setWidth(startWidth + e.clientX - startX);
            }

            function onUp() {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                document.body.classList.remove("select-none");
                resizer.classList.remove("bg-blue-500");
                localStorage.setItem(
                    "sidebar-width",
                    String(parseInt(sidebar.style.width, 10)));
                scheduleSave();
            }

            resizer.addEventListener("mousedown", (e) => {
                e.preventDefault();
                startX = e.clientX;
                startWidth = sidebar.getBoundingClientRect().width;
                document.body.classList.add("select-none");
                resizer.classList.add("bg-blue-500");
                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", onUp);
            });

            resizer.addEventListener("dblclick", () => {
                localStorage.removeItem("sidebar-width");
                setWidth(DEFAULT_WIDTH);
                scheduleSave();
            });

            const saved = parseInt(localStorage.getItem("sidebar-width"), 10);
            if (!isNaN(saved)) setWidth(saved);
        }
        document.addEventListener("DOMContentLoaded", initSidebarResize);

        // -----------------------------------------------------------------------------
        // Right-click context menu for tree nodes carrying [data-tree-menu].
        // Purely visual for now: items are placeholders without server actions.
        // -----------------------------------------------------------------------------
        function initContextMenu() {
            const menu = document.getElementById("ctx-menu");
            if (!menu) return;

            let currentTableURL = null;

            function hideMenu() {
                menu.classList.add("hidden");
                currentTableURL = null;
            }

            function menuItem(label, danger) {
                const b = document.createElement("button");
                b.className = "block w-full text-left px-3 py-1.5 hover:bg-gray-700 " +
                    (danger ? "text-red-400 hover:text-red-300" : "");
                b.textContent = label;
                return b;
            }

            function openMenu(x, y, el) {
                menu.innerHTML = "";
                currentTableURL = null;

                const btn = el.querySelector("button[hx-get]");
                if (btn) currentTableURL = btn.getAttribute("hx-get");

                menu.appendChild(menuItem("Delete", true));

                const divider = document.createElement("div");
                divider.className = "my-1 border-t border-gray-700";
                menu.appendChild(divider);

                // "Scripts" row with a hover submenu.
                const row = document.createElement("div");
                row.className = "relative group";
                const trigger = document.createElement("button");
                trigger.className = "w-full text-left px-3 py-1.5 hover:bg-gray-700 flex items-center justify-between";
                trigger.innerHTML = '<span>Scripts</span><span class="text-xs text-gray-500">▸</span>';
                const sub = document.createElement("div");
                sub.className = "absolute left-full top-0 hidden group-hover:block bg-gray-800 border border-gray-600 rounded shadow-xl py-1 min-w-[12rem]";
                ["CREATE Script", "DELETE Script", "INSERT Script",
                 "SELECT Script", "UPDATE Script"].forEach(
                    (label) => {
                        const item = menuItem(label, false);
                        item.addEventListener("click", () => {
                            if (label === "SELECT Script" && currentTableURL) {
                                openSelectScriptTab(currentTableURL);
                            } else if (label === "CREATE Script" && currentTableURL) {
                                openCreateScriptTab(currentTableURL);
                            } else if (label === "INSERT Script" && currentTableURL) {
                                openInsertScriptTab(currentTableURL);
                            } else if (label === "DELETE Script" && currentTableURL) {
                                openDeleteScriptTab(currentTableURL);
                            } else {
                                openTab(label);
                            }
                        });
                        sub.appendChild(item);
                    });
                row.append(trigger, sub);
                menu.appendChild(row);

                menu.classList.remove("hidden");

                // Keep the menu inside the viewport.
                menu.style.left = "0px";
                menu.style.top = "0px";
                const rect = menu.getBoundingClientRect();
                menu.style.left = Math.max(0, Math.min(x, window.innerWidth - rect.width - 4)) + "px";
                menu.style.top = Math.max(0, Math.min(y, window.innerHeight - rect.height - 4)) + "px";
            }

            document.addEventListener("contextmenu", (e) => {
                const el = e.target.closest("[data-tree-menu]");
                if (!el) {
                    hideMenu();
                    return;
                }
                e.preventDefault();
                openMenu(e.clientX, e.clientY, el);
            });
            document.addEventListener("click", hideMenu);
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hideMenu();
            });
            window.addEventListener("blur", hideMenu);
        }
        document.addEventListener("DOMContentLoaded", initContextMenu);

        // -----------------------------------------------------------------------------
        // Tab management – open / switch / close tabs dynamically.
        // -----------------------------------------------------------------------------
        let tabCounter = 0;

        function switchTab(id) {
            document.querySelectorAll(".tab-btn").forEach((btn) => {
                const isActive = btn.dataset.tabId === id;
                btn.classList.toggle("bg-gray-900", isActive);
                btn.classList.toggle("text-blue-400", isActive);
                btn.classList.toggle("border-t-2", isActive);
                btn.classList.toggle("border-blue-500", isActive);
                btn.classList.toggle("text-gray-400", !isActive);
                btn.classList.toggle("hover:text-gray-200", !isActive);
            });
            document.querySelectorAll(".tab-panel").forEach((panel) => {
                panel.style.display = panel.id === "tab-content-" + id ? "" : "none";
            });
        }

        function switchOutputTab(tab) {
            const panel = tab.closest("[id^='tab-content']");
            if (!panel) return;
            const name = tab.dataset.outputTab;

            panel.querySelectorAll(".output-tab").forEach((t) => {
                const active = t.dataset.outputTab === name;
                t.classList.toggle("text-blue-400", active);
                t.classList.toggle("font-bold", active);
                t.classList.toggle("border-t-blue-500", active);
                t.classList.toggle("text-gray-400", !active);
                t.classList.toggle("font-normal", !active);
                t.classList.toggle("border-t-transparent", !active);
            });
            panel.querySelectorAll(".output-panel").forEach((p) => {
                p.classList.toggle("hidden", p.id !== name + "-panel" && p.id !== "data-grid");
            });
            if (name === "data") {
                const dg = panel.querySelector("#data-grid");
                if (dg) dg.classList.remove("hidden");
            }
        }

        function logMessage(panel, type, text) {
            const box = panel.querySelector("#messages-panel > div");
            if (!box) return;
            const ts = new Date().toLocaleTimeString();
            const colors = { info: "text-gray-300", success: "text-green-400", error: "text-red-400", warn: "text-yellow-400" };
            const line = document.createElement("div");
            line.className = "py-0.5 " + (colors[type] || "text-gray-300");
            line.textContent = "[" + ts + "] " + text;
            box.appendChild(line);
            box.parentElement.scrollTop = box.parentElement.scrollHeight;
        }

        function panelTabId(panel) {
            return (panel.id || "").replace("tab-content-", "");
        }

        function executeQuery(btn, page) {
            const panel = btn.closest("[id^='tab-content']");
            if (!panel) return;
            const form = panel.querySelector("#query-editor");
            const grid = panel.querySelector("#data-grid");
            const status = panel.querySelector(".query-status");
            const pag = panel.querySelector(".pagination-controls");
            const pageInfo = panel.querySelector(".page-info");
            if (!form || !grid) return;

            const editor = form.querySelector("textarea[name='sql_query']");
            const sid = form.querySelector("input[name='server_id']");
            const db = form.querySelector("input[name='db_name']");
            if (!sid || !db || !editor) return;

            const selStart = editor.selectionStart;
            const selEnd = editor.selectionEnd;
            const hasSelection = selStart !== selEnd;
            const query = hasSelection
                ? editor.value.substring(selStart, selEnd)
                : editor.value;
            if (!query) return;

            if (!page) page = 1;

            const body = new URLSearchParams({
                sql_query: query,
                server_id: sid.value,
                db_name: db.value,
                tab_id: panelTabId(panel),
                page: String(page),
                limit: "1000",
            });

            const t0 = performance.now();
            if (status) status.textContent = "Executing...";
            fetch("/api/execute-query", { method: "POST", body })
                .then((r) => {
                    if (!r.ok) throw r;
                    return r.text();
                })
                .then((html) => {
                    const tmp = document.createElement("div");
                    tmp.innerHTML = html;
                    const result = tmp.querySelector(".query-result");
                    const elapsed = result.dataset.elapsed || "0";
                    const message = result.dataset.message || "";
                    if (grid && result) grid.innerHTML = result.innerHTML;

                    const total = parseInt(result.dataset.total) || 0;
                    const totalPages = parseInt(result.dataset.totalPages) || 1;
                    const curPage = parseInt(result.dataset.page) || 1;
                    const rows = grid ? grid.querySelectorAll("tbody tr").length : 0;

                    logMessage(panel, "info", "Query executed in " + elapsed + "s");

                    if (message) {
                        if (status) status.textContent = message + " — " + elapsed + "s";
                        logMessage(panel, "success", message);
                    } else {
                        if (status) status.textContent = total + " row" + (total !== 1 ? "s" : "") + " (" + rows + " on page) — " + elapsed + "s";
                        logMessage(panel, "success", total + " row" + (total !== 1 ? "s" : "") + " returned");
                    }

                    if (totalPages > 1) {
                        pag.classList.remove("hidden");
                        pageInfo.textContent = "Page " + curPage + " of " + totalPages;
                        pag.dataset.page = curPage;
                        pag.dataset.totalPages = totalPages;
                    } else {
                        pag.classList.add("hidden");
                    }

                    if (hasSelection) {
                        editor.focus();
                        editor.setSelectionRange(selStart, selEnd);
                    }
                })
                .catch(async (r) => {
                    const elapsed = ((performance.now() - t0) / 1000).toFixed(3);
                    const msg = r.body ? await r.text() : "Request failed";
                    grid.innerHTML = '<div class="p-4 text-red-400 text-sm">' + msg + '</div>';
                    if (status) status.textContent = "Error — " + elapsed + "s";
                    if (pag) pag.classList.add("hidden");

                    logMessage(panel, "error", "Query failed after " + elapsed + "s: " + msg);

                    const msgTab = panel.querySelector('[data-output-tab="messages"]');
                    if (msgTab) switchOutputTab(msgTab);

                    if (hasSelection) {
                        editor.focus();
                        editor.setSelectionRange(selStart, selEnd);
                    }
                });
        }

        function goToPage(btn, action) {
            const panel = btn.closest("[id^='tab-content']");
            const pag = panel.querySelector(".pagination-controls");
            let page = parseInt(pag.dataset.page) || 1;
            const totalPages = parseInt(pag.dataset.totalPages) || 1;

            if (action === "prev") page = Math.max(1, page - 1);
            else if (action === "next") page = Math.min(totalPages, page + 1);
            else if (action === "last") page = totalPages;
            else if (typeof action === "number") page = action;

            const execBtn = panel.querySelector("button[onclick='executeQuery(this)']");
            if (execBtn) executeQuery(execBtn, page);
        }

        function switchScriptPane(tabBtn) {
            const panel = tabBtn.closest("[id^='tab-content']");
            if (!panel) return;
            const name = tabBtn.dataset.scriptTab;

            panel.querySelectorAll(".script-tab").forEach((t) => {
                const active = t.dataset.scriptTab === name;
                t.classList.toggle("text-gray-200", active);
                t.classList.toggle("font-semibold", active);
                t.classList.toggle("text-gray-400", !active);
            });
            panel.querySelectorAll(".script-pane").forEach((p) => {
                p.classList.toggle("hidden", p.dataset.pane !== name);
            });

            if (name === "history") loadQueryHistory(panel);
        }

        // Loads the query history list for this panel's connection into the
        // history pane, unless it has already been fetched.
        function loadQueryHistory(panel) {
            const pane = panel.querySelector("#query-history-pane");
            if (!pane) return;

            const form = panel.querySelector("#query-editor");
            const sid = form ? form.querySelector("input[name='server_id']") : null;
            const db = form ? form.querySelector("input[name='db_name']") : null;

            const params = new URLSearchParams();
            if (sid) params.set("server_id", sid.value);
            if (db) params.set("db_name", db.value);
            params.set("tab_id", panelTabId(panel));

            pane.innerHTML = '<div class="p-3 text-xs text-gray-500 italic">Loading…</div>';

            fetch("/api/query-history?" + params.toString())
                .then((r) => { if (!r.ok) throw r; return r.text(); })
                .then((html) => {
                    pane.innerHTML = html;
                    pane.querySelectorAll(".history-item").forEach((item) => {
                        item.addEventListener("click", () => useHistoryItem(panel, item));
                    });
                })
                .catch((r) => {
                    pane.innerHTML = '<div class="p-3 text-xs text-red-400">Failed to load query history.</div>';
                });
        }

        // Loads a history entry's SQL back into the editor, returns to the
        // Query pane and runs it.
        function useHistoryItem(panel, item) {
            const editor = panel.querySelector("textarea[name='sql_query']");
            if (!editor) return;

            const b64 = item.dataset.historyB64;
            if (b64) editor.value = decodeURIComponent(escape(atob(b64)));

            const queryTab = panel.querySelector('.script-tab[data-script-tab="query"]');
            if (queryTab) switchScriptPane(queryTab);

            const execBtn = panel.querySelector("button[onclick='executeQuery(this)']");
            if (execBtn) execBtn.click();
        }

        // Generates a unique id for a newly opened script tab. GUIDs keep tab
        // ids collision-free across sessions (the same id is persisted to
        // workspace_tabs and used as the query_history.tab_id key).
        function newTabId() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return "tab-" + (++tabCounter);
        }

        function openTab(label, query, serverID, dbName, id) {
            if (!id) {
                id = newTabId();
            } else {
                const n = parseInt(id.replace("tab-", ""), 10);
                if (!isNaN(n) && n > tabCounter) tabCounter = n;
            }

            // Create tab button
            const btn = document.createElement("button");
            btn.className = "tab-btn flex items-center space-x-2 px-4 py-2 font-medium rounded-t text-gray-400 hover:text-gray-200";
            btn.dataset.tabId = id;
            btn.innerHTML = '<span>' + label + '</span>' +
                '<span class="text-xs text-gray-500 hover:text-gray-300" onclick="closeTab(\'' + id + '\', event)">✕</span>';
            btn.addEventListener("click", (e) => {
                if (e.target.textContent === "✕") return;
                switchTab(id);
            });
            document.getElementById("tab-bar").appendChild(btn);

            // Create content panel and fetch its content from the server
            const panel = document.createElement("div");
            panel.id = "tab-content-" + id;
            panel.className = "tab-panel flex-1 flex flex-col overflow-hidden bg-gray-900 text-gray-200";
            panel.style.display = "none";
            document.getElementById("tab-contents").appendChild(panel);

            switchTab(id);

            return fetch("/api/tabs/script-panel")
                .then((r) => r.text())
                .then((html) => {
                    panel.innerHTML = html;

                    if (query) {
                        const editor = panel.querySelector("textarea[name='sql_query']");
                        if (editor) editor.value = query;
                    }
                    if (serverID && dbName) {
                        const form = panel.querySelector("#query-editor");
                        if (form) {
                            const sid = document.createElement("input");
                            sid.type = "hidden"; sid.name = "server_id"; sid.value = serverID;
                            form.appendChild(sid);
                            const db = document.createElement("input");
                            db.type = "hidden"; db.name = "db_name"; db.value = dbName;
                            form.appendChild(db);
                        }
                    }

                    // F5 keyboard shortcut and auto-save of the editor content
                    const textarea = panel.querySelector("textarea[name='sql_query']");
                    const execBtn = panel.querySelector("button[onclick='executeQuery(this)']");
                    if (textarea && execBtn) {
                        textarea.addEventListener("keydown", (e) => {
                            if (e.key === "F5") { e.preventDefault(); execBtn.click(); }
                        });
                        textarea.addEventListener("input", scheduleSave);
                    }
                    scheduleSave();
                });
        }

        function openSelectScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            // URL: /api/servers/{id}/databases/{db}/schemas/{schema}/tables/{table}
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/columns")
                .then((r) => r.json())
                .then((data) => {
                    openTab("SELECT " + tableName, data.query, serverID, dbName);
                });
        }

        function openCreateScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            // URL: /api/servers/{id}/databases/{db}/schemas/{schema}/tables/{table}
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/create-script")
                .then((r) => { if (!r.ok) throw r; return r.json(); })
                .then((data) => {
                    openTab("CREATE " + tableName, data.query, serverID, dbName);
                });
        }

        function openInsertScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            // URL: /api/servers/{id}/databases/{db}/schemas/{schema}/tables/{table}
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/insert-script")
                .then((r) => { if (!r.ok) throw r; return r.json(); })
                .then((data) => {
                    openTab("INSERT " + tableName, data.query, serverID, dbName);
                });
        }

        function openDeleteScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/delete-script")
                .then((r) => { if (!r.ok) throw r; return r.json(); })
                .then((data) => {
                    openTab("DELETE " + tableName, data.query, serverID, dbName);
                });
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const btn = document.querySelector('.tab-btn[data-tab-id="' + id + '"]');
            const panel = document.getElementById("tab-content-" + id);
            if (btn) btn.remove();
            if (panel) panel.remove();

            // Switch to the last remaining tab (Dashboard is always first)
            const remaining = document.querySelectorAll(".tab-btn");
            if (remaining.length > 0) {
                const last = remaining[remaining.length - 1];
                switchTab(last.dataset.tabId);
            }
        }

        // -----------------------------------------------------------------------------
        // Workspace persistence – save UI state to sqlite and restore it after refresh.
        // -----------------------------------------------------------------------------
        let workspaceRestored = false;
        let restoringWorkspace = false;
        let saveTimer = null;
        let selectedTreeId = "servers-group";
        let pendingTreeState = null;
        let treeRestoreApplied = false;

        function collectWorkspaceState() {
            const tabs = [];
            document.querySelectorAll(".tab-btn").forEach((btn) => {
                if (btn.dataset.tabId === "dashboard") return;
                const panel = document.getElementById("tab-content-" + btn.dataset.tabId);
                if (!panel) return;
                const form = panel.querySelector("#query-editor");
                const editor = form ? form.querySelector("textarea[name='sql_query']") : null;
                const sid = form ? form.querySelector("input[name='server_id']") : null;
                const db = form ? form.querySelector("input[name='db_name']") : null;
                const titleEl = btn.querySelector("span");
                tabs.push({
                    id: btn.dataset.tabId,
                    title: titleEl ? titleEl.textContent : "Query",
                    server_id: sid ? parseInt(sid.value, 10) || 0 : 0,
                    db_name: db ? db.value : "",
                    query: editor ? editor.value : "",
                    tab_order: tabs.length,
                });
            });

            const active = Array.from(document.querySelectorAll(".tab-btn"))
                .find((b) => b.classList.contains("bg-gray-900"));
            const sidebar = document.getElementById("sidebar");
            const treeRoot = document.getElementById("tree-root");
            const expandedTree = [];
            if (treeRoot) {
                treeRoot.querySelectorAll("div[id]").forEach((d) => {
                    if (d.childElementCount > 0) expandedTree.push(d.id);
                });
            }

            return {
                active_tab_id: active ? active.dataset.tabId : "dashboard",
                layout: {
                    sidebar_width: sidebar ? String(parseInt(sidebar.style.width, 10) || 256) : "",
                    selected_tree: selectedTreeId,
                    expanded_tree: expandedTree,
                },
                tabs: tabs,
            };
        }

        function saveWorkspace(beacon) {
            const body = JSON.stringify(collectWorkspaceState());
            if (beacon && navigator.sendBeacon) {
                navigator.sendBeacon(
                    "/api/workspace",
                    new Blob([body], { type: "application/json" }));
                return;
            }
            fetch("/api/workspace", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: body,
            }).catch(() => {});
        }

        function scheduleSave() {
            if (!workspaceRestored || restoringWorkspace) return;
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { saveTimer = null; saveWorkspace(false); }, 500);
        }

        function restoreWorkspace() {
            if (workspaceRestored || !document.getElementById("tab-bar")) return;
            workspaceRestored = true;
            restoringWorkspace = true;

            fetch("/api/workspace")
                .then((r) => r.json())
                .then(async (state) => {
                    const layout = state.layout || {};
                    if (layout.sidebar_width) {
                        const sidebar = document.getElementById("sidebar");
                        if (sidebar) sidebar.style.width = layout.sidebar_width + "px";
                    }

                    pendingTreeState = {
                        selected_tree: layout.selected_tree || "",
                        expanded_tree: layout.expanded_tree || [],
                    };
                    waitForTreeRoot(() => applyTreeRestore(), 50);

                    const openings = (state.tabs || []).map((tab) =>
                        openTab(tab.title, tab.query, tab.server_id, tab.db_name, tab.id));

                    await Promise.all(openings);

                    const target = document.querySelector(
                        '.tab-btn[data-tab-id="' + state.active_tab_id + '"]');
                    switchTab(target ? state.active_tab_id : "dashboard");
                })
                .catch(() => switchTab("dashboard"))
                .finally(() => { restoringWorkspace = false; });
        }

        // Highlights the currently selected tree node (the one whose children
        // container matches selectedTreeId).
        function highlightTreeSelection() {
            document.querySelectorAll("#tree-root button[hx-get]").forEach((b) => {
                const active = b.getAttribute("hx-target") === "#" + selectedTreeId;
                b.classList.toggle("text-blue-400", active);
                b.classList.toggle("font-semibold", active);
            });
        }

        // Expands one lazily-loaded tree node by fetching its children exactly
        // like htmx would (the button and its container are siblings).
        // Resolves with true when the node was (or already is) expanded,
        // false when its container does not exist yet (parent not loaded).
        function expandTreeContainer(id) {
            const container = document.getElementById(id);
            if (container && container.childElementCount > 0) return Promise.resolve(true);
            if (!container) return Promise.resolve(false);
            const btn = container.previousElementSibling;
            if (!btn || !btn.hasAttribute("hx-get")) return Promise.resolve(false);
            const url = btn.getAttribute("hx-get");
            return fetch(url)
                .then((r) => { if (!r.ok) throw r; return r.text(); })
                .then((html) => {
                    container.innerHTML = html;
                    if (window.htmx && htmx.process) htmx.process(container);
                    return true;
                })
                .catch(() => false);
        }

        // Re-expands the saved tree state after a page refresh. Parent nodes
        // are fetched before children by retrying in rounds until no pending
        // node can be expanded, then the saved selection is highlighted.
        function applyTreeRestore() {
            if (treeRestoreApplied || !pendingTreeState) return;
            if (!document.getElementById("servers-group")) return;
            treeRestoreApplied = true;
            const state = pendingTreeState;
            pendingTreeState = null;

            const remaining = (state.expanded_tree || []).slice();
            if (state.selected_tree && !remaining.includes(state.selected_tree)) {
                remaining.push(state.selected_tree);
            }

            function step() {
                const pending = remaining.slice();
                remaining.length = 0;
                let progressed = false;
                let chain = Promise.resolve();
                pending.forEach((id) => {
                    chain = chain.then(() =>
                        expandTreeContainer(id).then((done) => {
                            if (done) progressed = true;
                            else remaining.push(id);
                        }));
                });
                chain.then(() => {
                    if (progressed && remaining.length > 0) {
                        step();
                    } else {
                        if (state.selected_tree) selectedTreeId = state.selected_tree;
                        highlightTreeSelection();
                    }
                });
            }
            step();
        }

        // Waits (polling) until the root tree node exists, i.e. the tree has
        // been loaded, then invokes cb.
        function waitForTreeRoot(cb, tries) {
            const el = document.getElementById("servers-group");
            if (el) { cb(); return; }
            if (tries <= 0) return;
            setTimeout(() => waitForTreeRoot(cb, tries - 1), 100);
        }

        // Remembers the clicked tree node and persists the selection.
        document.addEventListener("click", (e) => {
            const btn = e.target.closest("#tree-root button[hx-get]");
            if (!btn) return;
            const target = btn.getAttribute("hx-target");
            if (!target) return;
            selectedTreeId = target.replace(/^#/, "");
            highlightTreeSelection();
            scheduleSave();
        });
        document.addEventListener("DOMContentLoaded", restoreWorkspace);
        document.addEventListener("DOMContentLoaded", () => {
            const tabBar = document.getElementById("tab-bar");
            if (tabBar) tabBar.addEventListener("click", scheduleSave);
        });
        window.addEventListener("pagehide", () => {
            if (workspaceRestored) saveWorkspace(true);
        });

        // The auth shell is swapped in place (#app-root, outerHTML), so the
        // DOMContentLoaded restore only runs on the first visit. Watch for the
        // login <-> dashboard transitions and re-run / reset accordingly.
        function observeAuthLayout() {
            document.addEventListener("htmx:afterSwap", (e) => {
                const elt = e.detail && e.detail.elt;
                if (!elt || elt.id !== "app-root") return;
                if (document.getElementById("tab-bar")) {
                    if (!workspaceRestored) restoreWorkspace();
                } else if (workspaceRestored) {
                    workspaceRestored = false;
                    restoringWorkspace = false;
                    treeRestoreApplied = false;
                    pendingTreeState = null;
                    selectedTreeId = "servers-group";
                    tabCounter = 0;
                    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
                }
            });
        }
        document.addEventListener("DOMContentLoaded", observeAuthLayout);
    </script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen font-sans antialiased" hx-request='{"credentials": "same-origin"}'>

    <!-- Right-click context menu (filled in and shown by initContextMenu) -->
    <div id="ctx-menu"
         class="fixed z-50 hidden select-none bg-gray-800 border border-gray-600 rounded shadow-xl text-sm text-gray-200 py-1 min-w-[11rem]"></div>

    {{ if not .Authenticated }}
    <!-- ==========================================
         1. UNAUTHENTICATED LAYOUT (Login Shell)
         ========================================== -->
    <div class="flex items-center justify-center min-h-screen p-4" id="app-root">
        {{ template "login_content" . }}
    </div>

    {{ else }}
    <!-- ==========================================
         2. AUTHENTICATED LAYOUT (Main Application Shell)
         ========================================== -->
    <div class="flex flex-col h-screen overflow-hidden" id="app-root">
        
        <!-- Header / Server Switcher -->
        <header class="w-full bg-gray-800 border-b border-gray-700 flex justify-between items-center p-4">
            <span class="font-bold text-lg text-blue-400">Postgres Admin</span>
            <button hx-post="/logout" 
                    hx-target="#app-root" 
                    hx-select="#app-root"
                    hx-swap="outerHTML" 
                    class="text-xs bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white px-2 py-1 rounded transition">
                Logout
            </button>
        </header>

        <!-- Main Content Area (SQL Editor / Table Data View) -->
        {{ template "main_content" . }}

    </div>
    {{ end }}

</body>
</html>
