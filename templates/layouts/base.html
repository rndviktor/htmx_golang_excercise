<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }}{{ else }}Admin{{ end }}</title>
    <!-- Load htmx & CSS -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen font-sans antialiased" hx-request='{"credentials": "same-origin"}'>

    {{ if not .Authenticated }}
    <!-- ==========================================
         1. UNAUTHENTICATED LAYOUT (Login Shell)
         ========================================== -->
    <div class="flex items-center justify-center min-h-screen p-4" id="app-root">
        {{ template "login_content" . }}
    </div>

    {{ else }}
    <!-- ==========================================
         2. AUTHENTICATED LAYOUT (Main Application Shell)
         ========================================== -->
    <div class="flex flex-col h-screen overflow-hidden" id="app-root">
        
        <!-- Header / Server Switcher -->
        <header class="w-full bg-gray-800 border-b border-gray-700 flex justify-between items-center p-4">
            <span class="font-bold text-lg text-blue-400">Postgres Admin</span>
            <button hx-post="/logout" 
                    hx-target="#app-root" 
                    hx-select="#app-root"
                    hx-swap="outerHTML" 
                    class="text-xs bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white px-2 py-1 rounded transition">
                Logout
            </button>
        </header>

        <!-- Main Content Area (SQL Editor / Table Data View) -->
        {{ template "main_content" . }}

    </div>
    {{ end }}

</body>
</html>

{{ define "login_content" }}
  <!-- Default empty fallback if not defined by login.html -->
{{ end }}

{{ define "main_content" }}
  <!-- Default empty fallback if not defined by index.html -->
{{ end }}
