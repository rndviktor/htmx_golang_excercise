<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }}{{ else }}Admin{{ end }}</title>
    <!-- Load htmx & CSS -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
        // Collapses an expanded tree node. Returns true when the node was
        // open (caller should cancel the pending htmx request), false when
        // it should be fetched/expanded.
        function toggleTreeChildren(containerId) {
            const el = document.getElementById(containerId);
            if (el && el.childElementCount > 0) {
                el.innerHTML = "";
                return true;
            }
            return false;
        }

        // Makes the #sidebar panel resizable by dragging #sidebar-resizer.
        // Clamped between SIDEBAR_MIN and half the window; the chosen width
        // is remembered in localStorage. Double-click resets to the default.
        function initSidebarResize() {
            const sidebar = document.getElementById("sidebar");
            const resizer = document.getElementById("sidebar-resizer");
            if (!sidebar || !resizer) return;

            const MIN_WIDTH = 180;
            const DEFAULT_WIDTH = 256; // Tailwind w-64
            let startX = 0, startWidth = 0;

            function setWidth(px) {
                const max = Math.floor(window.innerWidth / 2);
                sidebar.style.width =
                    Math.min(max, Math.max(MIN_WIDTH, px)) + "px";
            }

            function onMove(e) {
                setWidth(startWidth + e.clientX - startX);
            }

            function onUp() {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                document.body.classList.remove("select-none");
                resizer.classList.remove("bg-blue-500");
                localStorage.setItem(
                    "sidebar-width",
                    String(parseInt(sidebar.style.width, 10)));
                scheduleSave();
            }

            resizer.addEventListener("mousedown", (e) => {
                e.preventDefault();
                startX = e.clientX;
                startWidth = sidebar.getBoundingClientRect().width;
                document.body.classList.add("select-none");
                resizer.classList.add("bg-blue-500");
                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", onUp);
            });

            resizer.addEventListener("dblclick", () => {
                localStorage.removeItem("sidebar-width");
                setWidth(DEFAULT_WIDTH);
                scheduleSave();
            });

            const saved = parseInt(localStorage.getItem("sidebar-width"), 10);
            if (!isNaN(saved)) setWidth(saved);
        }
        document.addEventListener("DOMContentLoaded", initSidebarResize);

        // -----------------------------------------------------------------------------
        // Right-click context menu for tree nodes carrying [data-tree-menu].
        // Purely visual for now: items are placeholders without server actions.
        // -----------------------------------------------------------------------------
        function initContextMenu() {
            const menu = document.getElementById("ctx-menu");
            if (!menu) return;

            let currentTableURL = null;
            let currentMenuKind = "";

            function hideMenu() {
                menu.classList.add("hidden");
                currentTableURL = null;
                currentMenuKind = "";
            }

            function menuItem(label, danger) {
                const b = document.createElement("button");
                b.className = "block w-full text-left px-3 py-1.5 hover:bg-gray-700 " +
                    (danger ? "text-red-400 hover:text-red-300" : "");
                b.textContent = label;
                return b;
            }

            function openMenu(x, y, el) {
                menu.innerHTML = "";
                currentTableURL = null;
                currentMenuKind = el.getAttribute("data-tree-menu") || "";

                const btn = el.querySelector("button[hx-get]");
                if (btn) currentTableURL = btn.getAttribute("hx-get");

                // "Query Tool" opens an empty script tab connected to the
                // node's database (valid for database, schema and table).
                const qtItem = menuItem("Query Tool", false);
                qtItem.addEventListener("click", () => {
                    const conn = connectionFromTreeURL(currentTableURL);
                    if (conn) {
                        openQueryToolTab(conn.serverID, conn.dbName);
                    } else {
                        openTab("Query Tool");
                    }
                });
                menu.appendChild(qtItem);

                menu.appendChild(menuItem("Delete", true));

                // The "Scripts" submenu generates table DDL/DML scripts, so it
                // is only offered when right-clicking a table node.
                if (currentMenuKind === "table") {
                    const divider = document.createElement("div");
                    divider.className = "my-1 border-t border-gray-700";
                    menu.appendChild(divider);

                    const row = document.createElement("div");
                    row.className = "relative group";
                    const trigger = document.createElement("button");
                    trigger.className = "w-full text-left px-3 py-1.5 hover:bg-gray-700 flex items-center justify-between";
                    trigger.innerHTML = '<span>Scripts</span><span class="text-xs text-gray-500">\u25B8</span>';
                    const sub = document.createElement("div");
                    sub.className = "absolute left-full top-0 hidden group-hover:block bg-gray-800 border border-gray-600 rounded shadow-xl py-1 min-w-[12rem]";
                    ["CREATE Script", "DELETE Script", "INSERT Script",
                     "SELECT Script", "UPDATE Script"].forEach(
                        (label) => {
                            const item = menuItem(label, false);
                            item.addEventListener("click", () => {
                                if (label === "SELECT Script" && currentTableURL) {
                                    openSelectScriptTab(currentTableURL);
                                } else if (label === "CREATE Script" && currentTableURL) {
                                    openCreateScriptTab(currentTableURL);
                                } else if (label === "INSERT Script" && currentTableURL) {
                                    openInsertScriptTab(currentTableURL);
                                } else if (label === "DELETE Script" && currentTableURL) {
                                    openDeleteScriptTab(currentTableURL);
                                } else {
                                    openTab(label);
                                }
                            });
                            sub.appendChild(item);
                        });
                    row.append(trigger, sub);
                    menu.appendChild(row);
                }

                menu.classList.remove("hidden");

                // Keep the menu inside the viewport.
                menu.style.left = "0px";
                menu.style.top = "0px";
                const rect = menu.getBoundingClientRect();
                menu.style.left = Math.max(0, Math.min(x, window.innerWidth - rect.width - 4)) + "px";
                menu.style.top = Math.max(0, Math.min(y, window.innerHeight - rect.height - 4)) + "px";
            }

            document.addEventListener("contextmenu", (e) => {
                const el = e.target.closest("[data-tree-menu]");
                if (!el) {
                    hideMenu();
                    return;
                }
                e.preventDefault();
                openMenu(e.clientX, e.clientY, el);
            });
            document.addEventListener("click", hideMenu);
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") hideMenu();
            });
            window.addEventListener("blur", hideMenu);
        }
        document.addEventListener("DOMContentLoaded", initContextMenu);

        // -----------------------------------------------------------------------------
        // Tab management – open / switch / close tabs dynamically.
        // -----------------------------------------------------------------------------
        let tabCounter = 0;

        function switchTab(id) {
            document.querySelectorAll(".tab-btn").forEach((btn) => {
                const isActive = btn.dataset.tabId === id;
                btn.classList.toggle("bg-gray-900", isActive);
                btn.classList.toggle("text-blue-400", isActive);
                btn.classList.toggle("border-t-2", isActive);
                btn.classList.toggle("border-blue-500", isActive);
                btn.classList.toggle("text-gray-400", !isActive);
                btn.classList.toggle("hover:text-gray-200", !isActive);
            });
            document.querySelectorAll(".tab-panel").forEach((panel) => {
                panel.style.display = panel.id === "tab-content-" + id ? "" : "none";
            });
            activeTabId = id;
            updateMonitoringForActiveTab();
            if (historyPanelOpen) {
                loadQueryHistory();
                openHistoryStream();
            }
        }

        // Monitoring only polls while the Dashboard tab is active. Switching to
        // another tab pauses polling; returning to it resumes (if a database or
        // deeper node is still the selected tree selection).
        function updateMonitoringForActiveTab() {
            if (activeTabId !== "dashboard") {
                if (monitoringTimer) { clearInterval(monitoringTimer); monitoringTimer = null; }
                closeMonitoringKPIStream();
                return;
            }
            if (monitoringConn && monitoringBaseURL) {
                pollMonitoring();
                openMonitoringKPIStream();
            }
        }

        function switchOutputTab(tab) {
            const panel = tab.closest("[id^='tab-content']");
            if (!panel) return;
            const name = tab.dataset.outputTab;

            panel.querySelectorAll(".output-tab").forEach((t) => {
                const active = t.dataset.outputTab === name;
                t.classList.toggle("text-blue-400", active);
                t.classList.toggle("font-bold", active);
                t.classList.toggle("border-t-blue-500", active);
                t.classList.toggle("text-gray-400", !active);
                t.classList.toggle("font-normal", !active);
                t.classList.toggle("border-t-transparent", !active);
            });
            panel.querySelectorAll(".output-panel").forEach((p) => {
                p.classList.toggle("hidden", p.id !== name + "-panel" && p.id !== "data-grid");
            });
            if (name === "data") {
                const dg = panel.querySelector("#data-grid");
                if (dg) dg.classList.remove("hidden");
            }
        }

        function logMessage(panel, type, text) {
            const box = panel.querySelector("#messages-panel > div");
            if (!box) return;
            const ts = new Date().toLocaleTimeString();
            const colors = { info: "text-gray-300", success: "text-green-400", error: "text-red-400", warn: "text-yellow-400" };
            const line = document.createElement("div");
            line.className = "py-0.5 " + (colors[type] || "text-gray-300");
            line.textContent = "[" + ts + "] " + text;
            box.appendChild(line);
            box.parentElement.scrollTop = box.parentElement.scrollHeight;
        }

        function panelTabId(panel) {
            return (panel.id || "").replace("tab-content-", "");
        }

        function executeQuery(btn, page) {
            const panel = btn.closest("[id^='tab-content']");
            if (!panel) return;
            const form = panel.querySelector("#query-editor");
            const grid = panel.querySelector("#data-grid");
            const status = panel.querySelector(".query-status");
            const pag = panel.querySelector(".pagination-controls");
            const pageInfo = panel.querySelector(".page-info");
            if (!form || !grid) return;

            const editor = form.querySelector("textarea[name='sql_query']");
            const sid = form.querySelector("input[name='server_id']");
            const db = form.querySelector("input[name='db_name']");
            if (!sid || !db || !editor) return;

            const selStart = editor.selectionStart;
            const selEnd = editor.selectionEnd;
            const hasSelection = selStart !== selEnd;
            const query = hasSelection
                ? editor.value.substring(selStart, selEnd)
                : editor.value;
            if (!query) return;

            if (!page) page = 1;

            const body = new URLSearchParams({
                sql_query: query,
                server_id: sid.value,
                db_name: db.value,
                tab_id: panelTabId(panel),
                page: String(page),
                limit: "1000",
            });

            const t0 = performance.now();
            if (status) status.textContent = "Executing...";
            fetch("/api/execute-query", { method: "POST", body })
                .then((r) => {
                    if (!r.ok) throw r;
                    return r.text();
                })
                .then((html) => {
                    const tmp = document.createElement("div");
                    tmp.innerHTML = html;
                    const result = tmp.querySelector(".query-result");
                    const elapsed = result.dataset.elapsed || "0";
                    const message = result.dataset.message || "";
                    if (grid && result) grid.innerHTML = result.innerHTML;

                    const total = parseInt(result.dataset.total) || 0;
                    const totalPages = parseInt(result.dataset.totalPages) || 1;
                    const curPage = parseInt(result.dataset.page) || 1;
                    const rows = grid ? grid.querySelectorAll("tbody tr").length : 0;

                    logMessage(panel, "info", "Query executed in " + elapsed + "s");

                    if (message) {
                        if (status) status.textContent = message + " — " + elapsed + "s";
                        logMessage(panel, "success", message);
                    } else {
                        if (status) status.textContent = total + " row" + (total !== 1 ? "s" : "") + " (" + rows + " on page) — " + elapsed + "s";
                        logMessage(panel, "success", total + " row" + (total !== 1 ? "s" : "") + " returned");
                    }

                    if (totalPages > 1) {
                        pag.classList.remove("hidden");
                        pageInfo.textContent = "Page " + curPage + " of " + totalPages;
                        pag.dataset.page = curPage;
                        pag.dataset.totalPages = totalPages;
                    } else {
                        pag.classList.add("hidden");
                    }

                    if (hasSelection) {
                        editor.focus();
                        editor.setSelectionRange(selStart, selEnd);
                    }
                })
                .catch(async (r) => {
                    const elapsed = ((performance.now() - t0) / 1000).toFixed(3);
                    const msg = r.body ? await r.text() : "Request failed";
                    grid.innerHTML = '<div class="p-4 text-red-400 text-sm">' + msg + '</div>';
                    if (status) status.textContent = "Error — " + elapsed + "s";
                    if (pag) pag.classList.add("hidden");

                    logMessage(panel, "error", "Query failed after " + elapsed + "s: " + msg);

                    const msgTab = panel.querySelector('[data-output-tab="messages"]');
                    if (msgTab) switchOutputTab(msgTab);

                    if (hasSelection) {
                        editor.focus();
                        editor.setSelectionRange(selStart, selEnd);
                    }
                });
        }

        // Runs the current selected/full query wrapped in EXPLAIN (or EXPLAIN
        // ANALYZE) and shows the plan in the Explain output tab.
        function executeExplain(btn, analyze) {
            const panel = btn.closest("[id^='tab-content']");
            if (!panel) return;
            const form = panel.querySelector("#query-editor");
            const explainPanel = panel.querySelector("#explain-panel > div");
            const status = panel.querySelector(".query-status");
            if (!form) return;

            const editor = form.querySelector("textarea[name='sql_query']");
            const sid = form.querySelector("input[name='server_id']");
            const db = form.querySelector("input[name='db_name']");
            if (!sid || !db || !editor) return;

            const hasSelection = editor.selectionStart !== editor.selectionEnd;
            const query = hasSelection
                ? editor.value.substring(editor.selectionStart, editor.selectionEnd)
                : editor.value;
            if (!query) return;

            const keyword = analyze ? "EXPLAIN ANALYZE" : "EXPLAIN";
            const body = new URLSearchParams({
                sql_query: keyword + " " + query,
                server_id: sid.value,
                db_name: db.value,
                tab_id: panelTabId(panel),
                page: "1",
                limit: "1000",
            });

            const t0 = performance.now();
            if (status) status.textContent = keyword + "...";
            fetch("/api/execute-query", { method: "POST", body })
                .then((r) => { if (!r.ok) throw r; return r.text(); })
                .then((html) => {
                    const tmp = document.createElement("div");
                    tmp.innerHTML = html;
                    const result = tmp.querySelector(".query-result");
                    if (result && explainPanel) {
                        explainPanel.innerHTML = result.innerHTML;
                    }
                    if (status) status.textContent = keyword + " — " + ((performance.now() - t0) / 1000).toFixed(3) + "s";
                    logMessage(panel, "info", keyword + " executed in " + ((performance.now() - t0) / 1000).toFixed(3) + "s");

                    const explainTab = panel.querySelector('[data-output-tab="explain"]');
                    if (explainTab) {
                        explainTab.classList.remove("hidden");
                        switchOutputTab(explainTab);
                    }
                })
                .catch(async (r) => {
                    const msg = r.body ? await r.text() : "Request failed";
                    if (explainPanel) explainPanel.innerHTML = '<div class="p-4 text-red-400 text-sm">' + msg + '</div>';
                    if (status) status.textContent = keyword + " — Error";
                    logMessage(panel, "error", keyword + " failed after " + ((performance.now() - t0) / 1000).toFixed(3) + "s: " + msg);
                    const explainTab = panel.querySelector('[data-output-tab="explain"]');
                    if (explainTab) {
                        explainTab.classList.remove("hidden");
                        switchOutputTab(explainTab);
                    }
                });
        }

        function goToPage(btn, action) {
            const panel = btn.closest("[id^='tab-content']");            const pag = panel.querySelector(".pagination-controls");
            let page = parseInt(pag.dataset.page) || 1;
            const totalPages = parseInt(pag.dataset.totalPages) || 1;

            if (action === "prev") page = Math.max(1, page - 1);
            else if (action === "next") page = Math.min(totalPages, page + 1);
            else if (action === "last") page = totalPages;
            else if (typeof action === "number") page = action;

            const execBtn = panel.querySelector("button[onclick='executeQuery(this)']");
            if (execBtn) executeQuery(execBtn, page);
        }

        function switchScriptPane(tabBtn) {
            const panel = tabBtn.closest("[id^='tab-content']");
            if (!panel) return;
            const name = tabBtn.dataset.scriptTab;

            panel.querySelectorAll(".script-tab").forEach((t) => {
                const active = t.dataset.scriptTab === name;
                t.classList.toggle("text-gray-200", active);
                t.classList.toggle("font-semibold", active);
                t.classList.toggle("text-gray-400", !active);
            });
            panel.querySelectorAll(".script-pane").forEach((p) => {
                p.classList.toggle("hidden", p.dataset.pane !== name);
            });
        }

        // VS Code-style right-hand history panel. The button toggles the panel
        // open/closed and re-labels the tab button.
        let historyPanelOpen = false;
        let historyDetailOpen = false;
        let historySource = null;

        function toggleHistoryPanel() {
            historyPanelOpen = !historyPanelOpen;
            const panel = document.getElementById("history-panel");
            const btn = document.getElementById("history-toggle");
            const label = document.getElementById("history-toggle-label");
            if (panel) panel.classList.toggle("hidden", !historyPanelOpen);
            if (label) label.classList.toggle("hidden", !historyPanelOpen);
            if (btn) btn.classList.toggle("text-blue-400", historyPanelOpen);

            if (historyPanelOpen) {
                loadQueryHistory();
                openHistoryStream();
            } else {
                closeHistoryStream();
            }
        }

        // Subscribes to SSE updates for the current connection so new history
        // rows repaint the panel without polling. Reconnects if the connection
        // changes while open.
        function openHistoryStream() {
            if (!historyPanelOpen) return;
            closeHistoryStream();
            const conn = currentHistoryConnection();
            if (!conn) return;
            const src = new EventSource(
                "/api/query-history/stream?server_id=" + encodeURIComponent(conn.serverID) +
                "&db_name=" + encodeURIComponent(conn.dbName));
            src.onmessage = () => {
                // Only repaint the list, leaving a detail view untouched.
                if (!historyPanelOpen || historyDetailOpen) return;
                loadQueryHistory();
            };
            // EventSource auto-reconnects on error; leave it be.
            historySource = src;
        }

        function closeHistoryStream() {
            if (historySource) { historySource.close(); historySource = null; }
        }

        // Resolves the connection to scope the history panel to: the active
        // script tab if one exists, otherwise the current tree selection.
        function currentHistoryConnection() {
            const activePanel = document.getElementById("tab-content-" + activeTabId);
            if (activePanel) {
                const form = activePanel.querySelector("#query-editor");
                if (form) {
                    const sid = form.querySelector("input[name='server_id']");
                    const db = form.querySelector("input[name='db_name']");
                    if (sid && sid.value && db && db.value) {
                        return { serverID: sid.value, dbName: db.value };
                    }
                }
            }
            if (monitoringConn) return { serverID: String(monitoringConn.serverID), dbName: monitoringConn.dbName };
            return null;
        }

        // Loads the query history list for the current connection into the
        // global history panel.
        function loadQueryHistory() {
            const pane = document.getElementById("query-history-pane");
            if (!pane) return;
            historyDetailOpen = false;

            const conn = currentHistoryConnection();
            if (!conn) {
                pane.innerHTML = '<div class="p-3 text-xs text-gray-500 italic">Select a database to view query history.</div>';
                return;
            }

            const params = new URLSearchParams();
            params.set("server_id", conn.serverID);
            params.set("db_name", conn.dbName);
            params.set("tab_id", "");

            pane.innerHTML = '<div class="p-3 text-xs text-gray-500 italic">Loading…</div>';

            fetch("/api/query-history?" + params.toString())
                .then((r) => { if (!r.ok) throw r; return r.text(); })
                .then((html) => {
                    pane.innerHTML = html;
                    pane.querySelectorAll(".history-item").forEach((item) => {
                        item.addEventListener("click", () => useHistoryItem(item));
                    });
                })
                .catch(() => {
                    pane.innerHTML = '<div class="p-3 text-xs text-red-400">Failed to load query history.</div>';
                });
        }

        // Loads a history entry's details into the history panel.
        function useHistoryItem(item) {
            const id = item.dataset.historyId;
            const serverID = item.dataset.historyServer || "";
            const dbName = item.dataset.historyDb || "";
            if (!id) return;

            const pane = document.getElementById("query-history-pane");
            if (!pane) return;
            historyDetailOpen = true;

            fetch("/api/query-history/" + id + "?server_id=" + serverID + "&db_name=" + dbName)
                .then((r) => { if (!r.ok) throw r; return r.text(); })
                .then((html) => {
                    pane.innerHTML = html;
                });
        }

        function historyBack() {
            loadQueryHistory();
        }

        function copyToEditor(btn) {
            const code = btn.closest(".border").querySelector("code").innerText;
            const serverID = btn.dataset.serverId;
            const dbName = btn.dataset.dbName;
            openTab("Query", code, serverID, dbName);
        }

        // Extracts {serverID, dbName} from a tree node URL of the form
        // /api/servers/{id}/databases/{db}/[...]/children. Returns null when
        // the URL is not a database-scoped path.
        function connectionFromTreeURL(url) {
            if (!url) return null;
            const parts = url.split("/");
            if (parts[3] && parts[5]) {
                return { serverID: parts[3], dbName: parts[5] };
            }
            return null;
        }

        // Opens an empty script tab connected to the given database.
        function openQueryToolTab(serverID, dbName) {
            openTab("Query Tool", "", serverID, dbName);
        }

        // Generates a unique id for a newly opened script tab. GUIDs keep tab
        // ids collision-free across sessions (the same id is persisted to
        // workspace_tabs and used as the query_history.tab_id key).
        function newTabId() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return "tab-" + (++tabCounter);
        }

        function openTab(label, query, serverID, dbName, id) {
            if (!id) {
                id = newTabId();
            } else {
                const n = parseInt(id.replace("tab-", ""), 10);
                if (!isNaN(n) && n > tabCounter) tabCounter = n;
            }

            // Create tab button
            const btn = document.createElement("button");
            btn.className = "tab-btn flex items-center space-x-2 px-4 py-2 font-medium rounded-t text-gray-400 hover:text-gray-200";
            btn.dataset.tabId = id;
            btn.innerHTML = '<span>' + label + '</span>' +
                '<span class="text-xs text-gray-500 hover:text-gray-300" onclick="closeTab(\'' + id + '\', event)">✕</span>';
            btn.addEventListener("click", (e) => {
                if (e.target.textContent === "✕") return;
                switchTab(id);
            });
            const tabBar = document.getElementById("tab-bar");
            const historyToggle = document.getElementById("history-toggle");
            // Insert before the history toggle so content tabs stay on the left
            // and the history button always remains right-aligned.
            if (historyToggle) tabBar.insertBefore(btn, historyToggle);
            else tabBar.appendChild(btn);

            // Create content panel and fetch its content from the server
            const panel = document.createElement("div");
            panel.id = "tab-content-" + id;
            panel.className = "tab-panel flex-1 flex flex-col overflow-hidden bg-gray-900 text-gray-200";
            panel.style.display = "none";
            document.getElementById("tab-contents").appendChild(panel);

            switchTab(id);

            return fetch("/api/tabs/script-panel")
                .then((r) => r.text())
                .then((html) => {
                    panel.innerHTML = html;

                    if (query) {
                        const editor = panel.querySelector("textarea[name='sql_query']");
                        if (editor) editor.value = query;
                    }
                    if (serverID && dbName) {
                        const form = panel.querySelector("#query-editor");
                        if (form) {
                            const sid = document.createElement("input");
                            sid.type = "hidden"; sid.name = "server_id"; sid.value = serverID;
                            form.appendChild(sid);
                            const db = document.createElement("input");
                            db.type = "hidden"; db.name = "db_name"; db.value = dbName;
                            form.appendChild(db);
                        }
                    }

                    // F5 keyboard shortcut and auto-save of the editor content
                    const textarea = panel.querySelector("textarea[name='sql_query']");
                    const execBtn = panel.querySelector("button[onclick='executeQuery(this)']");
                    if (textarea && execBtn) {
                        textarea.addEventListener("keydown", (e) => {
                            if (e.key === "F5") { e.preventDefault(); execBtn.click(); }
                        });
                        textarea.addEventListener("input", scheduleSave);
                    }
                    scheduleSave();
                });
        }

        function openSelectScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            // URL: /api/servers/{id}/databases/{db}/schemas/{schema}/tables/{table}
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/columns")
                .then((r) => r.json())
                .then((data) => {
                    openTab("SELECT " + tableName, data.query, serverID, dbName);
                });
        }

        function openCreateScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            // URL: /api/servers/{id}/databases/{db}/schemas/{schema}/tables/{table}
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/create-script")
                .then((r) => { if (!r.ok) throw r; return r.json(); })
                .then((data) => {
                    openTab("CREATE " + tableName, data.query, serverID, dbName);
                });
        }

        function openInsertScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            // URL: /api/servers/{id}/databases/{db}/schemas/{schema}/tables/{table}
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/insert-script")
                .then((r) => { if (!r.ok) throw r; return r.json(); })
                .then((data) => {
                    openTab("INSERT " + tableName, data.query, serverID, dbName);
                });
        }

        function openDeleteScriptTab(tableURL) {
            const baseURL = tableURL.replace(/\/children$/, "");
            const parts = baseURL.split("/");
            const tableName = parts.pop();
            const serverID = parts[3];
            const dbName = parts[5];
            fetch(baseURL + "/delete-script")
                .then((r) => { if (!r.ok) throw r; return r.json(); })
                .then((data) => {
                    openTab("DELETE " + tableName, data.query, serverID, dbName);
                });
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const btn = document.querySelector('.tab-btn[data-tab-id="' + id + '"]');
            const panel = document.getElementById("tab-content-" + id);
            if (btn) btn.remove();
            if (panel) panel.remove();

            // Switch to the last remaining tab (Dashboard is always first)
            const remaining = document.querySelectorAll(".tab-btn");
            if (remaining.length > 0) {
                const last = remaining[remaining.length - 1];
                switchTab(last.dataset.tabId);
            }
        }

        // -----------------------------------------------------------------------------
        // Workspace persistence – save UI state to sqlite and restore it after refresh.
        // -----------------------------------------------------------------------------
        let workspaceRestored = false;
        let restoringWorkspace = false;
        let saveTimer = null;
        let selectedTreeId = "servers-group";
        let pendingTreeState = null;
        let treeRestoreApplied = false;

        function collectWorkspaceState() {
            const tabs = [];
            document.querySelectorAll(".tab-btn").forEach((btn) => {
                if (btn.dataset.tabId === "dashboard") return;
                const panel = document.getElementById("tab-content-" + btn.dataset.tabId);
                if (!panel) return;
                const form = panel.querySelector("#query-editor");
                const editor = form ? form.querySelector("textarea[name='sql_query']") : null;
                const sid = form ? form.querySelector("input[name='server_id']") : null;
                const db = form ? form.querySelector("input[name='db_name']") : null;
                const titleEl = btn.querySelector("span");
                tabs.push({
                    id: btn.dataset.tabId,
                    title: titleEl ? titleEl.textContent : "Query",
                    server_id: sid ? parseInt(sid.value, 10) || 0 : 0,
                    db_name: db ? db.value : "",
                    query: editor ? editor.value : "",
                    tab_order: tabs.length,
                });
            });

            const active = Array.from(document.querySelectorAll(".tab-btn"))
                .find((b) => b.classList.contains("bg-gray-900"));
            const sidebar = document.getElementById("sidebar");
            const treeRoot = document.getElementById("tree-root");
            const expandedTree = [];
            if (treeRoot) {
                treeRoot.querySelectorAll("div[id]").forEach((d) => {
                    if (d.childElementCount > 0) expandedTree.push(d.id);
                });
            }

            return {
                active_tab_id: active ? active.dataset.tabId : "dashboard",
                layout: {
                    sidebar_width: sidebar ? String(parseInt(sidebar.style.width, 10) || 256) : "",
                    selected_tree: selectedTreeId,
                    expanded_tree: expandedTree,
                },
                tabs: tabs,
            };
        }

        function saveWorkspace(beacon) {
            const body = JSON.stringify(collectWorkspaceState());
            if (beacon && navigator.sendBeacon) {
                navigator.sendBeacon(
                    "/api/workspace",
                    new Blob([body], { type: "application/json" }));
                return;
            }
            fetch("/api/workspace", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: body,
            }).catch(() => {});
        }

        function scheduleSave() {
            if (!workspaceRestored || restoringWorkspace) return;
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { saveTimer = null; saveWorkspace(false); }, 500);
        }

        function restoreWorkspace() {
            if (workspaceRestored || !document.getElementById("tab-bar")) return;
            workspaceRestored = true;
            restoringWorkspace = true;

            fetch("/api/workspace")
                .then((r) => r.json())
                .then(async (state) => {
                    const layout = state.layout || {};
                    if (layout.sidebar_width) {
                        const sidebar = document.getElementById("sidebar");
                        if (sidebar) sidebar.style.width = layout.sidebar_width + "px";
                    }

                    pendingTreeState = {
                        selected_tree: layout.selected_tree || "",
                        expanded_tree: layout.expanded_tree || [],
                    };
                    waitForTreeRoot(() => applyTreeRestore(), 50);

                    const openings = (state.tabs || []).map((tab) =>
                        openTab(tab.title, tab.query, tab.server_id, tab.db_name, tab.id));

                    await Promise.all(openings);

                    const target = document.querySelector(
                        '.tab-btn[data-tab-id="' + state.active_tab_id + '"]');
                    switchTab(target ? state.active_tab_id : "dashboard");
                })
                .catch(() => switchTab("dashboard"))
                .finally(() => { restoringWorkspace = false; });
        }

        // Highlights the currently selected tree node (the one whose children
        // container matches selectedTreeId).
        function highlightTreeSelection() {
            document.querySelectorAll("#tree-root button[hx-get]").forEach((b) => {
                const active = b.getAttribute("hx-target") === "#" + selectedTreeId;
                b.classList.toggle("text-blue-400", active);
                b.classList.toggle("font-semibold", active);
            });
        }

        // Expands one lazily-loaded tree node by fetching its children exactly
        // like htmx would (the button and its container are siblings).
        // Resolves with true when the node was (or already is) expanded,
        // false when its container does not exist yet (parent not loaded).
        function expandTreeContainer(id) {
            const container = document.getElementById(id);
            if (container && container.childElementCount > 0) return Promise.resolve(true);
            if (!container) return Promise.resolve(false);
            const btn = container.previousElementSibling;
            if (!btn || !btn.hasAttribute("hx-get")) return Promise.resolve(false);
            const url = btn.getAttribute("hx-get");
            return fetch(url)
                .then((r) => { if (!r.ok) throw r; return r.text(); })
                .then((html) => {
                    container.innerHTML = html;
                    if (window.htmx && htmx.process) htmx.process(container);
                    return true;
                })
                .catch(() => false);
        }

        // Re-expands the saved tree state after a page refresh. Parent nodes
        // are fetched before children by retrying in rounds until no pending
        // node can be expanded, then the saved selection is highlighted.
        function applyTreeRestore() {
            if (treeRestoreApplied || !pendingTreeState) return;
            if (!document.getElementById("servers-group")) return;
            treeRestoreApplied = true;
            const state = pendingTreeState;
            pendingTreeState = null;

            const remaining = (state.expanded_tree || []).slice();
            if (state.selected_tree && !remaining.includes(state.selected_tree)) {
                remaining.push(state.selected_tree);
            }

            function step() {
                const pending = remaining.slice();
                remaining.length = 0;
                let progressed = false;
                let chain = Promise.resolve();
                pending.forEach((id) => {
                    chain = chain.then(() =>
                        expandTreeContainer(id).then((done) => {
                            if (done) progressed = true;
                            else remaining.push(id);
                        }));
                });
                chain.then(() => {
                    if (progressed && remaining.length > 0) {
                        step();
                    } else {
                        if (state.selected_tree) selectedTreeId = state.selected_tree;
                        highlightTreeSelection();
                        // Selecting a database (or anything below it) via the
                        // restored workspace should show monitoring, just like
                        // a real click.
                        const btn = document.querySelector(
                            '#tree-root button[hx-get][hx-target="#' + selectedTreeId + '"]');
                        if (btn) updateDashboardForTreeSelection(btn);
                    }
                });
            }
            step();
        }

        // Waits (polling) until the root tree node exists, i.e. the tree has
        // been loaded, then invokes cb.
        function waitForTreeRoot(cb, tries) {
            const el = document.getElementById("servers-group");
            if (el) { cb(); return; }
            if (tries <= 0) return;
            setTimeout(() => waitForTreeRoot(cb, tries - 1), 100);
        }

        // -----------------------------------------------------------------------------
        // Database Monitoring Dashboard
        // -----------------------------------------------------------------------------
        let monitoringTimer = null;
        let monitoringBaseURL = null;
        let monitoringInitialized = false;
        let monitoringConn = null;
        let monitoringSource = null;
        let monitoringInterval = 5000;
        let activeTabId = "dashboard";
        let monitoringState = {
            blksHit: 0, blksRead: 0,
            xactCommit: 0, xactRollback: 0,
            inserts: 0, updates: 0, deletes: 0,
        };
        const chartSeries = {
            cacheHit: [], replication: [], tps: [], ins: [], upd: [], del: [], time: [],
        };
        let charts = {};

        function formatBytes(bytes) {
            if (bytes === null || bytes === undefined || bytes < 0) return "–";
            const units = ["B", "KB", "MB", "GB", "TB"];
            let i = 0, n = bytes;
            while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
            return n.toFixed(i === 0 ? 0 : 1) + " " + units[i];
        }

        function makeChart(canvasId, type, labels, datasets) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return null;
            if (charts[canvasId]) charts[canvasId].destroy();
            const ctx = canvas.getContext("2d");
            if (!ctx) return null;
            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { labels: { color: "#cbd5e1", boxWidth: 12, font: { size: 10 } } } },
                    scales: {
                        x: { ticks: { color: "#64748b", maxTicksLimit: 10 }, grid: { color: "#334155" } },
                        y: { ticks: { color: "#64748b" }, grid: { color: "#1e293b", beginAtZero: true } },
                    },
                },
            });
            return charts[canvasId];
        }

        function renderMonitoringCharts() {
            const labels = chartSeries.time;
            const datasets = [];

            // Cache hit ratio (line, %) — computed from cumulative hits/reads deltas.
            makeChart("chart-cache-hit", "line", labels, [{
                label: "Cache Hit %",
                data: chartSeries.cacheHit,
                borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,0.1)",
                fill: true, tension: 0.3, pointRadius: 0,
            }]);

            // Replication lag (line, bytes).
            makeChart("chart-replication", "line", labels, [{
                label: "Lag (bytes)",
                data: chartSeries.replication,
                borderColor: "#a855f7", backgroundColor: "rgba(168,85,247,0.1)",
                fill: true, tension: 0.3, pointRadius: 0,
            }]);

            // Transaction throughput (line, TPS). commits+rollbacks.
            makeChart("chart-txn", "line", labels, [{
                label: "Commits/s",
                data: chartSeries.tps,
                borderColor: "#22c55e", backgroundColor: "rgba(34,197,94,0.1)",
                fill: true, tension: 0.3, pointRadius: 0,
            }]);

            // Row operations (line). inserts / updates / deletes per second.
            makeChart("chart-rowops", "line", labels, [
                { label: "Inserts/s", data: chartSeries.ins, borderColor: "#3b82f6", tension: 0.3, pointRadius: 0 },
                { label: "Updates/s", data: chartSeries.upd, borderColor: "#eab308", tension: 0.3, pointRadius: 0 },
                { label: "Deletes/s", data: chartSeries.del, borderColor: "#ef4444", tension: 0.3, pointRadius: 0 },
            ]);

        }

        function updateKPIs(data) {
            document.getElementById("kpi-active-conn").textContent = data.activeConnections;
            document.getElementById("kpi-max-conn").querySelector(".kpi-max-val").textContent =
                (data.maxConnections || 0).toString();
            document.getElementById("kpi-db-size").textContent = formatBytes(data.dbSizeBytes);
            document.getElementById("kpi-active-tx").textContent = data.activeTx;
            document.getElementById("kpi-idle-tx").textContent = data.idleTx;
            document.getElementById("kpi-idle").textContent = data.idle;
            document.getElementById("kpi-blocked").textContent = data.blockedQueries;

            const lagEl = document.getElementById("kpi-repl-lag");
            if (data.hasReplication) {
                lagEl.textContent = formatUnits(data.replicationLagBytes, { bytes: ["B", "KB", "MB", "GB", "TB"] });
                document.getElementById("kpi-repl-unit").textContent = "";
            } else {
                lagEl.textContent = "–";
                document.getElementById("kpi-repl-unit").textContent = "no replica";
            }
        }

        function formatUnits(val, units) {
            let i = 0, n = val;
            while (n >= 1024 && i < units.bytes.length - 1) { n /= 1024; i++; }
            return n.toFixed(i === 0 ? 0 : 1) + " " + units.bytes[i];
        }

        function refreshMonitoring() {
            if (!monitoringBaseURL) return;
            // Same-origin fetch with credentials so the signed auth cookie is
            // sent (matching htmx's default). Without it RequireAuth redirects
            // to /login and fetch reports "Failed to fetch".
            fetch(monitoringBaseURL, { credentials: "same-origin", headers: { "HX-Request": "true" } })
                .then(async (r) => {
                    if (!r.ok) {
                        let msg = "HTTP " + r.status;
                        try { const t = await r.text(); if (t) msg += ": " + t; } catch (_) {}
                        throw new Error(msg);
                    }
                    return r.json();
                })
                .then((data) => {
                    updateKPIs(data);

                    // The first sample only establishes the baseline for the
                    // cumulative counters (pg_stat_* hold totals since start),
                    // so no time-series point is produced until the 2nd poll.
                    if (!monitoringInitialized) {
                        monitoringInitialized = true;
                        monitoringState.blksHit = data.blksHit;
                        monitoringState.blksRead = data.blksRead;
                        monitoringState.xactCommit = data.xactCommit;
                        monitoringState.xactRollback = data.xactRollback;
                        monitoringState.inserts = data.inserts;
                        monitoringState.updates = data.updates;
                        monitoringState.deletes = data.deletes;
                        renderMonitoringCharts();
                        if (typeof refreshSessions === 'function') refreshSessions();
                        if (typeof refreshLocks === 'function') refreshLocks();
                        if (typeof refreshPrepared === 'function') refreshPrepared();
                        return;
                    }

                    // Cache hit ratio since last sample (%). Use the buffer delta.
                    const blksHitDelta = data.blksHit - monitoringState.blksHit;
                    const blksReadDelta = data.blksRead - monitoringState.blksRead;
                    const total = blksHitDelta + blksReadDelta;
                    monitoringState.blksHit = data.blksHit;
                    monitoringState.blksRead = data.blksRead;
                    const cacheHit = total > 0 ? (blksHitDelta / total) * 100 : 100;
                    chartSeries.cacheHit.push(cacheHit);

                    // TPS since last sample.
                    const commitDelta = data.xactCommit - monitoringState.xactCommit;
                    const rollbackDelta = data.xactRollback - monitoringState.xactRollback;
                    monitoringState.xactCommit = data.xactCommit;
                    monitoringState.xactRollback = data.xactRollback;
                    const tps = commitDelta + rollbackDelta;
                    chartSeries.tps.push(tps);

                    // Row op rates since last sample.
                    chartSeries.ins.push(data.inserts - monitoringState.inserts);
                    chartSeries.upd.push(data.updates - monitoringState.updates);
                    chartSeries.del.push(data.deletes - monitoringState.deletes);
                    monitoringState.inserts = data.inserts;
                    monitoringState.updates = data.updates;
                    monitoringState.deletes = data.deletes;

                    // Replication lag.
                    chartSeries.replication.push(
                        data.hasReplication ? data.replicationLagBytes : 0);

                    // Sessions breakdown (latest snapshot).
                    if (typeof refreshSessions === 'function') refreshSessions();
                    if (typeof refreshLocks === 'function') refreshLocks();
                    if (typeof refreshPrepared === 'function') refreshPrepared();

                    // Keep a rolling window of ~30 points.
                    chartSeries.time.push(new Date().toLocaleTimeString());
                    ["cacheHit", "tps", "ins", "upd", "del", "replication", "time"].forEach((k) => {
                        if (chartSeries[k].length > 30) chartSeries[k].shift();
                    });

                    renderMonitoringCharts();
                })
                .catch((err) => {
                    setMonitoringError(err && err.message ? err.message : String(err));
                });
        }

        function setMonitoringError(msg) {
            const el = document.getElementById("monitoring-error");
            if (!el) return;
            el.textContent = "Monitoring error: " + msg;
            el.classList.remove("hidden");
            clearTimeout(setMonitoringError._t);
            setMonitoringError._t = setTimeout(() => el.classList.add("hidden"), 8000);
        }

        // Switches the Dashboard tab button between "Dashboard" and "Monitor"
        // (with an activity pulse icon) depending on whether monitoring is live.
        function setDashboardTabLabel(monitoring) {
            const label = document.getElementById("tab-dashboard-label");
            const icon = document.getElementById("tab-dashboard-icon");
            if (monitoring) {
                // Monitoring mode: single icon only, hide text and spacing.
                if (icon) icon.textContent = "🟢";
                if (label) label.style.display = "none";
            } else {
                if (icon) icon.textContent = "📊";
                if (label) { label.style.display = ""; label.textContent = "Dashboard"; }
            }
        }

        // Opens the SSE KPI stream for the current connection so KPI cards update
        // instantly between the 5s chart polls. Only runs while the Dashboard
        // tab is active.
        function openMonitoringKPIStream() {
            closeMonitoringKPIStream();
            if (!monitoringConn || activeTabId !== "dashboard") return;
            const src = new EventSource(
                "/api/servers/" + encodeURIComponent(monitoringConn.serverID) +
                "/databases/" + encodeURIComponent(monitoringConn.dbName) + "/monitoring/stream");
            src.onmessage = (e) => {
                let data;
                try { data = JSON.parse(e.data); } catch (_) { return; }
                updateKPIs(data);
            };
            monitoringSource = src;
        }

        function closeMonitoringKPIStream() {
            if (monitoringSource) { monitoringSource.close(); monitoringSource = null; }
        }

        function startMonitoring(serverID, dbName) {
            monitoringBaseURL = "/api/servers/" + serverID + "/databases/" + dbName + "/monitoring";
            monitoringConn = { serverID: serverID, dbName: dbName };
            setDashboardTabLabel(true);

            // Reset cumulative counters so the first sample establishes a clean
            // baseline and no historical spike appears.
            monitoringInitialized = false;
            monitoringState = { blksHit: 0, blksRead: 0, xactCommit: 0, xactRollback: 0, inserts: 0, updates: 0, deletes: 0 };
            Object.keys(chartSeries).forEach((k) => { chartSeries[k] = []; });

            const defaultView = document.getElementById("dashboard-default");
            const monView = document.getElementById("dashboard-monitoring");
            if (defaultView) defaultView.classList.add("hidden");
            if (monView) monView.classList.remove("hidden");
            const label = document.getElementById("monitoring-conn-label");
            if (label) label.textContent = dbName + " (server " + serverID + ")";

            // Initial render, then poll charts while the Dashboard tab is active.
            renderMonitoringCharts();
            if (activeTabId !== "dashboard") return;
            pollMonitoring();
            openMonitoringKPIStream();
        }

        function pollMonitoring() {
            if (!monitoringBaseURL) return;
            refreshMonitoring();
            if (monitoringTimer) clearInterval(monitoringTimer);
            monitoringTimer = setInterval(refreshMonitoring, monitoringInterval);
        }

        // Sets the chart polling interval (ms) and restarts the timer live.
        function setMonitoringInterval(val) {
            const ms = parseInt(val, 10);
            if (isNaN(ms) || ms < 1000) return;
            monitoringInterval = ms;
            if (monitoringTimer && monitoringBaseURL) pollMonitoring();
        }

        function stopMonitoring() {
            if (monitoringTimer) { clearInterval(monitoringTimer); monitoringTimer = null; }
            monitoringBaseURL = null;
            monitoringConn = null;
            closeMonitoringKPIStream();
            setDashboardTabLabel(false);
            const defaultView = document.getElementById("dashboard-default");
            const monView = document.getElementById("dashboard-monitoring");
            if (defaultView) defaultView.classList.remove("hidden");
            if (monView) monView.classList.add("hidden");
        }

        // Decides, from the clicked tree node's URL, whether a database (or
        // anything below it) is selected and the monitoring dashboard should
        // be shown. Any node scoped under /databases/{db} shares that database
        // connection, so schema, table and their category folders all qualify.
        function updateDashboardForTreeSelection(btn) {
            const url = btn ? btn.getAttribute("hx-get") : null;
            // A database-scoped URL is any path that contains "/databases/{db}",
            // which connectionFromTreeURL detects via parts[5].
            const conn = connectionFromTreeURL(url);
            if (conn) {
                startMonitoring(conn.serverID, conn.dbName);
            } else {
                stopMonitoring();
            }
        }

        // Remembers the clicked tree node and persists the selection.
        document.addEventListener("click", (e) => {
            const btn = e.target.closest("#tree-root button[hx-get]");
            if (!btn) return;
            const target = btn.getAttribute("hx-target");
            if (!target) return;
            selectedTreeId = target.replace(/^#/, "");
            highlightTreeSelection();
            scheduleSave();
            updateDashboardForTreeSelection(btn);
        });
        document.addEventListener("DOMContentLoaded", restoreWorkspace);
        document.addEventListener("DOMContentLoaded", () => {
            const tabBar = document.getElementById("tab-bar");
            if (tabBar) tabBar.addEventListener("click", scheduleSave);
        });
        window.addEventListener("pagehide", () => {
            if (workspaceRestored) saveWorkspace(true);
        });

        // The auth shell is swapped in place (#app-root, outerHTML), so the
        // DOMContentLoaded restore only runs on the first visit. Watch for the
        // login <-> dashboard transitions and re-run / reset accordingly.
        function observeAuthLayout() {
            document.addEventListener("htmx:afterSwap", (e) => {
                const elt = e.detail && e.detail.elt;
                if (!elt || elt.id !== "app-root") return;
                if (document.getElementById("tab-bar")) {
                    if (!workspaceRestored) restoreWorkspace();
                } else if (workspaceRestored) {
                    stopMonitoring();
                    workspaceRestored = false;
                    restoringWorkspace = false;
                    treeRestoreApplied = false;
                    pendingTreeState = null;
                    selectedTreeId = "servers-group";
                    tabCounter = 0;
                    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
                }
            });
        }
        document.addEventListener("DOMContentLoaded", observeAuthLayout);
    </script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen font-sans antialiased" hx-request='{"credentials": "same-origin"}'>

    <!-- Right-click context menu (filled in and shown by initContextMenu) -->
    <div id="ctx-menu"
         class="fixed z-50 hidden select-none bg-gray-800 border border-gray-600 rounded shadow-xl text-sm text-gray-200 py-1 min-w-[11rem]"></div>

    {{ if not .Authenticated }}
    <!-- ==========================================
         1. UNAUTHENTICATED LAYOUT (Login Shell)
         ========================================== -->
    <div class="flex items-center justify-center min-h-screen p-4" id="app-root">
        {{ template "login_content" . }}
    </div>

    {{ else }}
    <!-- ==========================================
         2. AUTHENTICATED LAYOUT (Main Application Shell)
         ========================================== -->
    <div class="flex flex-col h-screen overflow-hidden" id="app-root">
        
        <!-- Header / Server Switcher -->
        <header class="w-full bg-gray-800 border-b border-gray-700 flex justify-between items-center p-4">
            <span class="font-bold text-lg text-blue-400">Postgres Admin</span>
            <button hx-post="/logout" 
                    hx-target="#app-root" 
                    hx-select="#app-root"
                    hx-swap="outerHTML" 
                    class="text-xs bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white px-2 py-1 rounded transition">
                Logout
            </button>
        </header>

        <!-- Main Content Area (SQL Editor / Table Data View) -->
        {{ template "main_content" . }}

    </div>
    {{ end }}

</body>
</html>
