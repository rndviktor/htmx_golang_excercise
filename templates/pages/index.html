{{ template "base.html" . }}

{{ define "main_content" }}
<div class="flex flex-1 min-h-0 bg-gray-900">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="shrink-0 bg-gray-800 border-r border-gray-700 flex flex-col" style="width: 256px;">
        <!-- Tree Navigation -->
        <div class="flex-1 overflow-y-auto p-4" id="tree-root" hx-get="/api/tree" hx-trigger="load, server-added from:body">
            <span class="text-sm text-gray-500">Select a server to load schema...</span>
        </div>
    </aside>

    <!-- Drag handle to resize the sidebar -->
    <div id="sidebar-resizer"
         class="w-1 shrink-0 cursor-col-resize bg-gray-700 hover:bg-blue-500 transition-colors"
         title="Drag to resize"></div>

    <!-- Main Area -->
    <div class="flex-1 flex flex-col overflow-hidden min-w-0">

        <!-- Tab Navigation Bar -->
        <div id="tab-bar" class="flex items-center bg-gray-800 border-b border-gray-700 px-2 pt-2 text-sm text-gray-300">
            <button onclick="switchTab('dashboard')"
                    data-tab-id="dashboard"
                    class="tab-btn flex items-center space-x-2 bg-gray-900 text-blue-400 border-t-2 border-blue-500 px-4 py-2 font-medium rounded-t">
                <span id="tab-dashboard-icon">📊</span>
                <span id="tab-dashboard-label">Dashboard</span>
            </button>
            <button onclick="toggleHistoryPanel()"
                    id="history-toggle"
                    class="ml-auto flex items-center gap-1.5 px-2.5 py-1.5 m-1 text-gray-300 hover:text-blue-400 hover:bg-gray-700 rounded transition"
                    title="Toggle Query History">
                <span id="history-toggle-icon">🕘</span>
                <span id="history-toggle-label" class="hidden">History</span>
            </button>
        </div>

        <!-- Tab Content Panels -->
        <div id="tab-contents" class="flex-1 flex flex-col overflow-hidden">

            <!-- Dashboard Panel -->
            <div id="tab-content-dashboard" class="tab-panel flex-1 flex flex-col overflow-hidden bg-gray-900 text-gray-200">
                <div class="flex-1 overflow-y-auto p-6">
                {{ template "dashboard_panel.html" . }}
                </div>
            </div>

        </div>

    </div>

    <!-- Query History (VS Code chat-area style right panel) -->
    <div id="history-panel"
         class="hidden flex shrink-0 flex-col bg-gray-800 border-l border-gray-700 text-gray-200 overflow-hidden"
         style="width: 360px;">
        <div id="query-history-pane" class="flex-1 overflow-auto"></div>
    </div>
</div>

<!-- Container for htmx modal responses -->
<div id="modal-container" hx-on:server-added="this.innerHTML=''"></div>
{{ end }}
